<!--
  adversary — self-contained Phase-1 report SHELL.

  This is the plugin's OWN renderer: the review skill fills this shell directly, so the HTML report
  and its embedded annotation layer work with NO external skill installed. (The visual-explainer skill
  is an OPTIONAL enhancer, not a requirement.)

  HOW THE RENDER STEP USES THIS:
  1. Copy this file to <rundir>/report.html.
  2. Replace __TITLE__ / __KICKER__ / __DEK__ / __BYLINE__ and fill __NAV_ITEMS__ (one <li><a href="#id">..</a></li> per section).
  3. Author the <main> sections per references/report-structure.md's §skeleton (verdict → how it ran →
     one section per finding with the math → survives → fix-plan placeholder → closing note).
     Give EVERY finding block `class="finding invalid|caveat" data-fid="F#"` where F# matches findings.json.
     Write the derivation, not just the verdict (display math in .mathbox; inline in \(...\)).
  4. At the two "EMBED annotation-layer" markers, paste the toolbar+<style>+<script> from
     references/annotation-layer.html and replace __RUN_SLUG__ with the run-dir slug.
  5. Open <rundir>/report.html.

  MathJax is configured for \(...\) and \[...\] ONLY — do NOT use $...$ (dollar amounts break it).
  Three semantic states are used everywhere: s-invalid (retracted) / s-caveat (weakened) / s-survives.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script>
  MathJax = { tex: { inlineMath: [['\\(','\\)']], displayMath: [['\\[','\\]']] }, options: { skipHtmlTags: ['script','noscript','style','textarea','pre','code'] } };
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
<style>
  :root{
    --bg:#faf8f4; --surface:#fffdf9; --surface-2:#f4f0e8; --text:#1c1a17; --text-dim:#6a635a;
    --border:rgba(28,26,23,.12); --gold:#9a7d28; --rule:rgba(28,26,23,.14);
    --invalid:#b21e35; --invalid-bg:rgba(178,30,53,.09);
    --caveat:#b45309; --caveat-bg:rgba(180,83,9,.10);
    --survives:#0f7a52; --survives-bg:rgba(15,122,82,.10);
  }
  @media (prefers-color-scheme:dark){ :root:not([data-theme]){
    --bg:#14110d; --surface:#1d1913; --surface-2:#251f18; --text:#efe9df; --text-dim:#a89e90;
    --border:rgba(239,233,223,.14); --gold:#d8b451; --rule:rgba(239,233,223,.16);
    --invalid:#f0708a; --invalid-bg:rgba(240,112,138,.13);
    --caveat:#e8a24d; --caveat-bg:rgba(232,162,77,.13);
    --survives:#54c99a; --survives-bg:rgba(84,201,154,.13);
  }}
  [data-theme="dark"]{
    --bg:#14110d; --surface:#1d1913; --surface-2:#251f18; --text:#efe9df; --text-dim:#a89e90;
    --border:rgba(239,233,223,.14); --gold:#d8b451; --rule:rgba(239,233,223,.16);
    --invalid:#f0708a; --invalid-bg:rgba(240,112,138,.13);
    --caveat:#e8a24d; --caveat-bg:rgba(232,162,77,.13);
    --survives:#54c99a; --survives-bg:rgba(84,201,154,.13);
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--text);font-family:"Newsreader",Georgia,serif;font-size:19px;line-height:1.62;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1180px;margin:0 auto;padding:0 clamp(18px,4vw,48px);display:grid;grid-template-columns:1fr}
  @media(min-width:1000px){ .wrap{grid-template-columns:220px 1fr;gap:52px;align-items:start} }
  h1,h2,h3{font-family:"Instrument Serif",Georgia,serif;font-weight:400;letter-spacing:.2px;line-height:1.1}
  code,.mono,.num{font-family:"JetBrains Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
  .num{font-size:.94em} a{color:var(--gold);text-decoration:none}
  header.mast{grid-column:1/-1;border-bottom:2px solid var(--text);margin:0 0 8px;padding:38px 0 20px}
  .kicker{font-family:"JetBrains Mono",monospace;font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold)}
  header.mast h1{font-size:clamp(38px,6vw,66px);margin:.18em 0 .1em}
  .dek{font-size:21px;color:var(--text-dim);max-width:70ch;font-style:italic}
  .byline{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--text-dim);margin-top:14px;letter-spacing:.04em}
  nav.toc{position:sticky;top:20px;font-family:"JetBrains Mono",monospace;font-size:12.5px;line-height:1.5;display:none}
  @media(min-width:1000px){ nav.toc{display:block} }
  nav.toc ol{list-style:none;margin:0;padding:0;border-left:1px solid var(--rule)}
  nav.toc a{display:block;color:var(--text-dim);padding:7px 0 7px 14px;margin-left:-1px;border-left:2px solid transparent}
  nav.toc a.active{color:var(--text);border-left-color:var(--gold);font-weight:600}
  .themebtn{margin-top:22px;background:var(--surface);border:1px solid var(--border);color:var(--text-dim);font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.1em;padding:8px 12px;border-radius:7px;cursor:pointer}
  .themebtn:hover{color:var(--text);border-color:var(--gold)}
  main{min-width:0}
  section{padding:40px 0;border-top:1px solid var(--rule)} section:first-of-type{border-top:none}
  h2{font-size:clamp(27px,3.6vw,38px);margin:0 0 6px}
  .sec-num{font-family:"JetBrains Mono",monospace;font-size:12px;letter-spacing:.24em;color:var(--gold);text-transform:uppercase}
  h3{font-size:25px;margin:30px 0 4px} p{margin:.5em 0}
  .lbl{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-dim);margin-top:18px}
  .pill{display:inline-flex;align-items:center;gap:6px;font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:3px 10px;border-radius:999px;border:1px solid;white-space:nowrap}
  .pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
  .s-invalid{color:var(--invalid);background:var(--invalid-bg);border-color:var(--invalid)}
  .s-caveat{color:var(--caveat);background:var(--caveat-bg);border-color:var(--caveat)}
  .s-survives{color:var(--survives);background:var(--survives-bg);border-color:var(--survives)}
  .verdict{display:flex;flex-wrap:wrap;align-items:center;gap:14px;background:var(--invalid-bg);border:1px solid var(--invalid);border-left:5px solid var(--invalid);border-radius:10px;padding:18px 22px;margin:8px 0 26px}
  .verdict strong{font-family:"Instrument Serif",serif;font-size:26px;color:var(--invalid);font-weight:400}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin:6px 0 30px}
  .kpi{background:var(--surface);border:1px solid var(--border);border-top:3px solid var(--gold);border-radius:10px;padding:16px 18px}
  .kpi.invalid{border-top-color:var(--invalid)} .kpi.survives{border-top-color:var(--survives)}
  .kpi .n{font-family:"Instrument Serif",serif;font-size:44px;line-height:1}
  .kpi .l{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.06em;color:var(--text-dim);text-transform:uppercase;margin-top:6px}
  .pipe{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;align-items:stretch;margin:18px 0 6px}
  @media(max-width:720px){ .pipe{grid-template-columns:1fr} .pipe .arrow{display:none} }
  .stage{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px}
  .stage .where{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--gold);letter-spacing:.06em}
  .stage .did{font-size:16px;color:var(--text-dim);margin-top:6px;line-height:1.4}
  .stage.bad{border-color:var(--invalid);background:var(--invalid-bg)}
  .arrow{display:flex;align-items:center;justify-content:center;color:var(--text-dim);font-size:26px;padding:0 10px}
  .capt{font-size:15px;color:var(--text-dim);font-style:italic;margin-top:10px}
  table{width:100%;border-collapse:collapse;margin:16px 0;font-size:16.5px}
  th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--rule);vertical-align:top}
  thead th{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-dim);border-bottom:1.5px solid var(--text)}
  tbody tr:hover{background:var(--surface-2)}
  .bad-val{color:var(--invalid);font-weight:600} .good-val{color:var(--survives);font-weight:600}
  .row-invalid{background:var(--invalid-bg)} .row-survives{background:var(--survives-bg)}
  .finding{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:24px 26px;margin:22px 0;position:relative}
  .finding.invalid{border-left:5px solid var(--invalid)} .finding.caveat{border-left:5px solid var(--caveat)}
  .finding .fhead{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:4px}
  .fid{font-family:"JetBrains Mono",monospace;font-weight:600;color:var(--gold)}
  .claim{font-style:italic;font-size:20px;border-left:3px solid var(--rule);padding-left:16px;margin:14px 0;color:var(--text)}
  .reached{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--survives)}
  .mathbox{background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:6px 18px;margin:12px 0;overflow-x:auto}
  .callout{background:var(--survives-bg);border:1px solid var(--survives);border-radius:10px;padding:18px 22px;margin:18px 0}
  .placeholder{background:var(--surface-2);border:1px dashed var(--border);border-radius:10px;padding:18px 22px;color:var(--text-dim)}
  footer{grid-column:1/-1;border-top:2px solid var(--text);margin-top:20px;padding:26px 0 90px;color:var(--text-dim);font-size:15px}
  .anchor-tag{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--text-dim)}

  <!-- EMBED annotation-layer styles: paste the <style> block from references/annotation-layer.html above this line -->
</style>
</head>
<body>
<div class="wrap">
  <header class="mast">
    <div class="kicker">__KICKER__</div>
    <h1>__TITLE__</h1>
    <p class="dek">__DEK__</p>
    <div class="byline">__BYLINE__</div>
  </header>

  <nav class="toc" aria-label="Sections">
    <ol>__NAV_ITEMS__</ol>
    <button class="themebtn" id="themebtn">◐ theme</button>
  </nav>

  <main>
    <!-- EMBED annotation-layer toolbar: paste the .annotbar + toast markup from references/annotation-layer.html here -->

    <!-- SECTIONS: author per references/report-structure.md §skeleton.
         Each finding: <div class="finding invalid|caveat" data-fid="F#"> <div class="fhead">…</div> … </div> -->

    <footer>Generated by the <span class="mono">adversary</span> plugin · Phase 1 (review).</footer>
  </main>
</div>

<script>
  (function(){ // theme toggle (persisted)
    var root=document.documentElement, btn=document.getElementById('themebtn');
    var saved=localStorage.getItem('adv-theme'); if(saved){root.setAttribute('data-theme',saved);}
    btn.addEventListener('click',function(){
      var cur=root.getAttribute('data-theme');
      var next = cur==='dark' ? 'light' : (cur==='light' ? 'dark' : (matchMedia('(prefers-color-scheme:dark)').matches?'light':'dark'));
      root.setAttribute('data-theme',next); localStorage.setItem('adv-theme',next);
    });
  })();
  (function(){ // scroll-spy
    var links=[].slice.call(document.querySelectorAll('nav.toc a')); var map={};
    links.forEach(function(a){map[a.getAttribute('href').slice(1)]=a;});
    var obs=new IntersectionObserver(function(es){ es.forEach(function(e){ if(e.isIntersecting){
      links.forEach(function(l){l.classList.remove('active');}); var a=map[e.target.id]; if(a)a.classList.add('active');
    }});},{rootMargin:'-15% 0px -70% 0px'});
    document.querySelectorAll('main section[id]').forEach(function(s){obs.observe(s);});
  })();
  // EMBED annotation-layer behaviour: paste the <script> IIFE from references/annotation-layer.html here (it substitutes/derives the run slug).
</script>
</body>
</html>
